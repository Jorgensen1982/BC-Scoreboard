<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>B&C Bar Live Scoreboard</title>

<style>

/* =================================
   B&C BAR FULLSCREEN SCOREBOARD
   ================================= */

* {
    box-sizing: border-box;
}

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000000;

    overflow: hidden;

}

#scoreboard {

    display: block;

    width: 100vw;

    height: 100vh;
    height: 100dvh;

    object-fit: contain;

    object-position: center;

    background: #000000;

}

</style>

</head>

<body>

<img
    id="scoreboard"
    src="scoreboard.png"
    alt="B&C Bar Live Scoreboard"
>

<script>

/* =================================
   AUTOMATIC IMAGE REFRESH
   ================================= */

const scoreboard = document.getElementById("scoreboard");

function updateScoreboard() {

    const newImage = new Image();

    newImage.onload = function() {

        scoreboard.src = newImage.src;

    };

    newImage.onerror = function() {

        console.log("Scoreboard update failed.");

    };

    newImage.src = "scoreboard.png?t=" + Date.now();

}

/* Initial update */

updateScoreboard();

/* Check every 15 seconds */

setInterval(updateScoreboard, 15000);

</script>

</body>

</html>
