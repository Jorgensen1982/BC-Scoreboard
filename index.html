
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>B&C Bar Live Scoreboard</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#scoreboard {
    display: none;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: contain;
    object-position: center;
    background: #000;
}

#status {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffcc00;
    text-align: center;
    font-size: 18px;
    padding: 20px;
}

#connection {
    position: fixed;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.8);
    color: #aaa;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
    z-index: 10;
}

</style>

</head>

<body>

<div id="status">
Connecting to B&C Bar Live Scoreboard...
</div>

<img
    id="scoreboard"
    alt="B&C Bar Live Scoreboard"
>

<div id="connection">
Connecting...
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    get,
    goOnline
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ======================================
   FIREBASE CONFIGURATION
   ====================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDcy1Zz0uAqhJTy1a0NeqgpQM9wvhoHWVw",

    authDomain:
    "bc-bar-scoreboard.firebaseapp.com",

    databaseURL:
    "https://bc-bar-scoreboard-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "bc-bar-scoreboard",

    storageBucket:
    "bc-bar-scoreboard.firebasestorage.app",

    messagingSenderId:
    "900224710254",

    appId:
    "1:900224710254:web:732b75ff534ba0e6ed187f"

};


/* ======================================
   INITIALIZE
   ====================================== */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const scoreboardRef = ref(db, "scoreboard/current");

const image = document.getElementById("scoreboard");

const status = document.getElementById("status");

const connection = document.getElementById("connection");

let currentVersion = null;

let requestNumber = 0;


/* ======================================
   DISPLAY IMAGE
   ====================================== */

function displayScoreboard(data) {

    if (!data || !data.image) {

        if (!image.src) {
            status.textContent = "Waiting for scoreboard...";
        }

        return;
    }

    const version = data.updatedAt || 0;

    if (version === currentVersion) {
        return;
    }

    const thisRequest = ++requestNumber;

    const newImage = new Image();

    newImage.onload = function() {

        if (thisRequest !== requestNumber) {
            return;
        }

        image.src = newImage.src;

        image.style.display = "block";

        status.style.display = "none";

        currentVersion = version;

        const time = version
            ? new Date(version).toLocaleTimeString()
            : new Date().toLocaleTimeString();

        connection.textContent =
            "Updated: " + time;

        connection.style.color = "#70ff70";

        console.log(
            "Scoreboard received:",
            time
        );

    };

    newImage.onerror = function() {

        connection.textContent =
            "Image loading error";

        connection.style.color = "#ff5555";

    };

    newImage.src = data.image;

}


/* ======================================
   FIREBASE LIVE LISTENER
   ====================================== */

onValue(

    scoreboardRef,

    snapshot => {

        if (snapshot.exists()) {

            displayScoreboard(snapshot.val());

        }
        else {

            if (!image.src) {
                status.textContent =
                    "Waiting for first scoreboard...";
            }

        }

    },

    error => {

        console.error(error);

        connection.textContent =
            "Connection error";

        connection.style.color = "#ff5555";

    }

);


/* ======================================
   REFRESH WHEN PHONE BECOMES ACTIVE
   ====================================== */

async function refreshScoreboard() {

    try {

        if (!navigator.onLine) {

            connection.textContent = "Offline";

            connection.style.color = "#ff5555";

            return;

        }

        goOnline(db);

        // Fetch the current database value again.
        // Web SDK get() may use local cache if the
        // server cannot be reached.

        const snapshot = await get(scoreboardRef);

        if (snapshot.exists()) {

            displayScoreboard(snapshot.val());

        }

    }
    catch (error) {

        console.error(
            "Refresh failed:",
            error
        );

        connection.textContent =
            "Reconnecting...";

        connection.style.color = "#ffcc00";

    }

}


/* ======================================
   PHONE / BROWSER EVENTS
   ====================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            refreshScoreboard();

        }

    }
);


window.addEventListener(
    "pageshow",
    () => {

        refreshScoreboard();

    }
);


window.addEventListener(
    "online",
    () => {

        refreshScoreboard();

    }
);


/* ======================================
   FALLBACK REFRESH
   ====================================== */

setInterval(() => {

    if (!document.hidden) {

        refreshScoreboard();

    }

}, 15000);

</script>

</body>

</html>
